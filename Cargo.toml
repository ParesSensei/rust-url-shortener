[package]
name = "url-shortener"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
serde = { version = "1.0.229", features = ["derive"] }
rand = "0.8.5"
url = "2.5.8"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "macros", "postgres"] }
dotenvy = "0.15.7"
tower-http = { version = "0.7.1", features = ["fs"] }
